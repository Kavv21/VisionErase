events { worker_connections 1024; }

http {
    upstream api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        
        # Small limit — API only receives JSON, never video bytes
        # Videos go directly to MinIO via presigned URLs
        client_max_body_size 10M;

        # API endpoints
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # WebSocket — long lived connections for progress streaming
        location /ws/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Health check
        location /health {
            proxy_pass http://api;
        }

        # Metrics — internal only, block external access
        location /metrics {
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://api;
        }

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
